; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; esp32dev is the only real firmware target - default to it so a plain
; `pio run` / `pio run -t upload` (or the IDE's build/upload buttons)
; doesn't also try to build the `native` unit-test environment below,
; which has no main() to build/upload as firmware. Run native tests
; explicitly with `pio test -e native`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5

; OTA twin of esp32dev - same board/sources, but flashes wirelessly over
; ota.h's WiFi access point instead of USB. Connect the laptop's WiFi to
; that AP (OTA_AP_SSID/PASSWORD in include/ota.h) first, then:
;   pio run -e esp32dev_ota -t upload
; upload_port is the ESP32's fixed SoftAP address (192.168.4.1) - no mDNS
; discovery needed since it's always the same on this dedicated AP.
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5
upload_protocol = espota
upload_port = 192.168.4.1

; Host-native unit tests (`pio test -e native`) for the modules with zero
; Arduino/hardware dependency - maze.cpp, pid.cpp. Everything else
; (motor/sensor/drive/battery/encoder/control/...) touches real hardware
; and isn't unit-testable this way - see the "Testing" section in
; README.md for how those are covered instead.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<maze.cpp> +<pid.cpp>
