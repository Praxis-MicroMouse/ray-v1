; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5

; Host-native unit tests (`pio test -e native`) for the modules with zero
; Arduino/hardware dependency - maze.cpp, pid.cpp, filter.cpp. Everything
; else (motor/sensor/drive/battery/encoder/mpu9250/control/...) touches
; real hardware and isn't unit-testable this way - see the "Testing"
; section in README.md for how those are covered instead.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<maze.cpp> +<pid.cpp> +<filter.cpp>
